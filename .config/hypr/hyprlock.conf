general {
    #no_fade_in = false
    #grace = 0
    #disable_loading = true
}

background {
    monitor =
    path = screenshot  # This takes a screenshot of your desktop and blurs it
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3 # 0 disables blurring
}

input-field {
    monitor = DP-2
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.10
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    placeholder_text = <i> Enter thy Password </i>
    hide_input = false
    ignore_empty_input = true
    position = 0, -50
    halign = center
    valign = center
}

# DATE
label {
    monitor = DP-2
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(200, 200, 200, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font Propo Italic
    position = 0, 10
    halign = center
    valign = center
}

# TIME
label {
    monitor = DP-2
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font Propo Italic
    position = 0, 80
    halign = center
    valign = center
}
