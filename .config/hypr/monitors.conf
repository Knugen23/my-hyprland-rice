################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
#49inch is DP-1 and 27inch is DP-2

monitor=DP-2, 2560x1440@59.95, 0x0,1		#BOTTOM
monitor=DP-1, 5120x1440@59.98, -1280x-1440 , 1			#TOP


# Assign 1-5 to your main monitor
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

# Assign 6 to your second monitor (DP-2)
workspace = 6, monitor:DP-2, default:true, persistent:true
#windowrulev = focusonactivate, class:^(steam_app_2479810)$
#windowrulev = monitor DP-2, class:^(steam_app_.*)$
windowrulev = workspace 6 silent, class:^(steam_app_.*)$
#windowrulev = move 0 0, class:^(steam_app_2479810)$
#windowrulev = size 2560 1440, class:^(steam_app_.*)$
